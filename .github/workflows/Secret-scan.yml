## API keys, sensitive data, credentials
## Gitleaks use

name: Secret Scan

on:
  workflow_call

jobs: 
  secret-scan:

    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
      
       # github action manages it   

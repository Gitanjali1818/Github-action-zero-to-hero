name: cicd

# manual click for continuous delivery
on:
  workflow_dispatch:
    inputs:
      enviornments:
        description: this is the ENV value where workflow runs.
        default: 'dev'
        required: true
        type: choice
      options:
       - dev
       - prod
       - stagging  

jobs:

  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "code clone from github"

  build: 
    runs-on: ubuntu-latest
    steps:
      - name: build docker container
        run: echo "docker container build"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: test the container
        run: echo "testing the container"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploying the container
        run: echo "deploy the container app"



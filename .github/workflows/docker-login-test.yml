name: Docker Login Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: YOUR_DOCKERHUB_USERNAME
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test Docker
        run: docker pull hello-world

## scan the docker file for issues and CVEs
## Tool- hadolint

name: Docker Lint

on:
  workflow_call:

jobs:
  validate-Dockfile:

    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

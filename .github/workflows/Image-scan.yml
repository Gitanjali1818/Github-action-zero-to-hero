## image scanner OR CVEs
## Tool: Trivy image scanner

name: Image Scanner

on:
  workflow_call:
    inputs:
     dockerhub-username:
        required: true
        type: string

     secrets:
       DOCKERHUB_TOKEN:
         required: true
    

jobs:
  image-scanner:
    runs-on: ubuntu-latest

    steps:
      
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ inputs.dockerhub-username }}/github-actions-app:latest'
          severity: 'CRITICAL'
          exit-code: '1'    
  

name: Commit Information

on:
  workflow_dispatch:

jobs:
  commit-info:
    runs-on: ubuntu-latest

    steps:
      - name: show Commit SHA
        run: echo "Commit SHA = ${{ github.sha }}"

      - name: Show Commit Message
        run: echo "Commit Message = ${{ github.event.head_commit.message }}"

      - name: Show Actor
        run: echo "Triggered By = ${{ github.actor }}"

      - name: Show workflow
        run: echo "Workflow = ${{ github.workflow }}"

      - name: Show Run number
        run: echo "Run number = ${{ github.run_number }}"
